; ============================================================
;  DOA 센싱 노드 — ESP32-S3-WROOM-1 N16R8
;  1단계: 마이크(INMP441 ×2) 테스트
; ============================================================
[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; 실제 모듈: ESP32-S3-WROOM-1 N16R8 (16MB QSPI flash + 8MB OPI PSRAM)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

monitor_speed = 921600   ; 오디오 스트리밍 대역폭 확보 (펌웨어 SERIAL_BAUD와 일치)
upload_speed  = 921600
upload_port   = COM3
monitor_port  = COM3

; 모니터가 DTR/RTS를 건드려 보드가 다운로드 모드로 리셋되는 것 방지
monitor_dtr = 0
monitor_rts = 0

; N16R8의 OPI PSRAM 초기화를 활성화한다. 현재 DSP 버퍼는 내부 RAM만으로도 충분하다.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; CH343 UART 브리지(COM3)로 시리얼 출력
