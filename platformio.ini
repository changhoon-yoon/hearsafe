; ============================================================
;  DOA 센싱 노드 — ESP32-S3-WROOM-1 N16R8
;  1단계: 마이크(INMP441 ×2) 테스트
; ============================================================
[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
upload_port   = COM3
monitor_port  = COM3

; 모니터가 DTR/RTS를 건드려 보드가 다운로드 모드로 리셋되는 것 방지
monitor_dtr = 0
monitor_rts = 0

; 진단용: PSRAM 비활성(바닐라) — 부팅 루프 원인 격리
; (마이크 테스트엔 PSRAM 불필요. 부팅되면 나중에 OPI PSRAM 설정 추가)
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0   ; CH343 UART 브리지(COM3)로 시리얼 출력
